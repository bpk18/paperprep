<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PaperPrep{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { transition: background-color 0.3s, color 0.3s; }</style>
</head>
<body class="bg-white text-black dark:bg-gray-900 dark:text-white transition duration-300">

<nav class="p-4 flex justify-between bg-gray-100 dark:bg-gray-800 shadow">
    <div class="text-xl font-bold"><a href="/">PaperPrep</a></div>
    <div class="space-x-4">
        <a href="/about">About</a>
        <a href="/privacy">Privacy</a>
        <a href="/contact">Contact</a>
        <a href="/terms">Terms</a>
        <button id="themeToggle" class="px-2 py-1 bg-gray-300 dark:bg-gray-700 rounded">Toggle Theme</button>
    </div>
</nav>

<main class="p-6 max-w-4xl mx-auto">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-4 p-4 rounded {{ 'bg-green-200 text-green-800' if category == 'success' else 'bg-red-200 text-red-800' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const themeToggle = document.getElementById("themeToggle");
        const html = document.documentElement;
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            html.classList.add("dark");
            html.setAttribute("data-theme", "dark");
        } else {
            html.classList.remove("dark");
            html.setAttribute("data-theme", "light");
        }

        themeToggle.addEventListener("click", () => {
            html.classList.toggle("dark");
            const isDark = html.classList.contains("dark");
            html.setAttribute("data-theme", isDark ? "dark" : "light");
            localStorage.setItem("theme", isDark ? "dark" : "light");
        });
    });
</script>
</body>
</html>
