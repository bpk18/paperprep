<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PAPERPREP{% endblock %}</title>

  <!-- SEO -->
  <meta name="description" content="Convert PDF, Word, Images, PPT, and more with PAPERPREP – the all-in-one file conversion toolkit. Fast, free, and easy to use." />
  <meta name="keywords" content="file converter, PAPERPREP, PDF tools, convert tools, online converter" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="PAPERPREP - Convert PDFs, Images & More" />
  <meta property="og:description" content="All-in-one file converter for students and professionals." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://paperprep.space/" />
  <meta property="og:image" content="{{ url_for('static', filename='logo.png') }}" />

  <!-- TailwindCSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='logo.jpg') }}" />

  <style>
    :root {
      --primary-dark: #1e293b;
      --primary-light: #f1f5f9;
    }

    body {
      background-color: var(--primary-light);
      color: #1f2937;
      transition: all 0.3s ease;
    }

    body.dark {
      background-color: var(--primary-dark);
      color: #f8fafc;
    }

    .header-text {
      color: #1e293b;
    }

    body.dark .header-text {
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <button id="theme-toggle" class="absolute top-5 right-5 p-2 rounded-full bg-gray-200 text-gray-800 shadow">
    <i id="theme-icon" class="fas fa-sun"></i>
  </button>

  <!-- Header -->
  <header class="text-center py-6">
    <h1 class="text-4xl font-bold header-text" style="font-family: 'Orbitron', sans-serif;">PAPERPREP</h1>
    <p class="text-sm text-gray-500 mt-1">File Conversion Made Easy</p>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center text-sm text-gray-500 py-6">
    <p>&copy; 2025 PAPERPREP | 
      <a href="{{ url_for('about') }}" class="underline hover:text-blue-600">About</a> | 
      <a href="{{ url_for('contact') }}" class="underline hover:text-blue-600">Contact</a> | 
      <a href="{{ url_for('privacy') }}" class="underline hover:text-blue-600">Privacy</a> | 
      <a href="{{ url_for('terms') }}" class="underline hover:text-blue-600">Terms</a>
    </p>
  </footer>

  <!-- Scripts -->
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const body = document.body;

    function applyTheme() {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        body.classList.add('dark');
        themeIcon.classList.remove('fa-sun');
        themeIcon.classList.add('fa-moon');
      } else {
        body.classList.remove('dark');
        themeIcon.classList.remove('fa-moon');
        themeIcon.classList.add('fa-sun');
      }
    }

    themeToggle.addEventListener('click', () => {
      const isDark = body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      applyTheme();
    });

    window.addEventListener('load', () => {
      applyTheme();
    });
  </script>
</body>
</html>
