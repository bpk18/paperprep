<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Merge multiple PDF files into a single PDF online.">
    <title>PDF Merger | PaperPrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .container {
            margin-top: 50px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">PDF Merger</h2>
        <form action="/pdf-merger" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="files" class="form-label">Select PDF Files to Merge:</label>
                <input type="file" class="form-control" name="files" multiple required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg mt-3 w-100">Merge PDFs</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
