<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Excel to PDF - PaperPrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<!-- Header Section -->
<header class="bg-primary text-white text-center py-4">
    <h1>Convert Excel to PDF</h1>
</header>

<!-- Conversion Form -->
<div class="container my-5">
    <h4>Select an Excel file to convert:</h4>
    <form action="{{ url_for('excel_to_pdf') }}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="file" class="form-label">Upload Excel File</label>
            <input type="file" class="form-control" name="file" id="file" required>
        </div>
        <button type="submit" class="btn btn-primary">Convert</button>
    </form>
</div>

<!-- Footer Section -->
<footer class="bg-dark text-white text-center py-4">
    <p>&copy; 2025 PaperPrep. All Rights Reserved.</p>
</footer>

<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
