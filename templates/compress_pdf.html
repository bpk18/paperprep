<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compress PDF - PaperPrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2 class="mb-3 text-center">Compress PDF</h2>
        <form method="POST" enctype="multipart/form-data" class="text-center">
            <input type="file" name="file" accept=".pdf" class="form-control mb-3" required>
            <button type="submit" class="btn btn-primary">Compress</button>
        </form>
    </div>
</body>
</html>
