{% extends "base.html" %}

{% block title %}{{ tool.replace('-', ' ').title() }} - PAPERPREP{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 shadow-md rounded-lg p-6">
  <h2 class="text-2xl font-semibold mb-4 text-center header-text capitalize">
    {{ tool.replace('-', ' ') }}
  </h2>
  <form method="POST" enctype="multipart/form-data" class="space-y-4">
    <div>
      <label for="file" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
        Upload your file{{ tool != 'merge-pdf' and tool != 'images-to-pdf' and tool != 'pdf-splitter' and tool != 'compress-image' and tool != 'compress-pdf' and tool != 'jpg-to-word' and tool != 'pdf-to-word' and 's' or 's' }}:
      </label>
      <input type="file" name="file" id="file" multiple class="w-full text-sm file:bg-indigo-500 file:text-white file:rounded-md file:border-0 file:px-4 file:py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white" required />
    </div>
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded w-full transition">
      Convert
    </button>
  </form>
</div>
{% endblock %}
