<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Word - PAPERPREP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>PAPERPREP</h1>
        <a href="/" class="back-button">Back to Tools</a>
        <button id="theme-toggle">Light/Dark Mode</button>
    </header>
    <main class="container">
        <div class="tool-container">
            <h2>PDF to Word</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="pdf_file">Upload PDF File:</label>
                    <input type="file" name="pdf_file" id="pdf_file" accept=".pdf" required>
                </div>
                <button type="submit" class="unique-button">Convert to Word</button>
            </form>
            <div class="output-area">
                </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 PAPERPREP - Your Document Conversion Hub</p>
    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
