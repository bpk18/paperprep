<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Word - PaperPrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/">PaperPrep</a>
  </div>
</nav>

<div class="container my-5">
    <h2 class="text-center mb-4">Convert PDF to Word</h2>
    <form action="/pdf-to-word" method="POST" enctype="multipart/form-data" class="text-center">
        <input type="file" name="file" accept=".pdf" class="form-control mb-3" required>
        <button type="submit" class="btn btn-success">Convert</button>
    </form>
</div>

<footer class="text-center py-4 bg-light mt-5">

</footer>

</body>
</html>
