<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Conversion Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        .tool-icon {
            font-size: 30px;
            margin-right: 10px;
        }
        .tool-box {
            margin: 20px;
        }
        .tool-box h2 {
            margin-bottom: 10px;
        }
        .tool-box button {
            font-size: 18px;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">File Conversion Tools</h1>
        
        <div class="row">
            <!-- PDF to Word Tool -->
            <div class="col-md-3 tool-box text-center">
                <i class="fas fa-file-pdf tool-icon"></i>
                <h2>PDF to Word</h2>
                <a href="/pdf-to-word" class="btn btn-primary">Convert</a>
            </div>

            <!-- JPG to PDF Tool -->
            <div class="col-md-3 tool-box text-center">
                <i class="fas fa-image tool-icon"></i>
                <h2>JPG to PDF</h2>
                <a href="/jpg-to-pdf" class="btn btn-primary">Convert</a>
            </div>

            <!-- Word to PDF Tool -->
            <div class="col-md-3 tool-box text-center">
                <i class="fas fa-file-word tool-icon"></i>
                <h2>Word to PDF</h2>
                <a href="/word-to-pdf" class="btn btn-primary">Convert</a>
            </div>

            <!-- Excel to PDF Tool -->
            <div class="col-md-3 tool-box text-center">
                <i class="fas fa-file-excel tool-icon"></i>
                <h2>Excel to PDF</h2>
                <a href="/excel-to-pdf" class="btn btn-primary">Convert</a>
            </div>
        </div>
    </div>
</body>
</html>
