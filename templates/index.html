<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PAPERPREP is a modern, mobile-responsive file conversion toolkit offering PDF, image, and presentation utilities.">
    <meta name="keywords" content="PAPERPREP, PDF to Word, Image to PDF, PPT to PDF, PDF tools, file conversion">
    <meta name="author" content="Your Name">
    <title>PAPERPREP - Smart File Conversion Tools</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
      // Set default theme to light
      if (!localStorage.getItem('theme')) {
          localStorage.setItem('theme', 'light');
          document.documentElement.setAttribute('data-theme', 'light');
      } else {
          document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));
      }
    </script>
</head>
<body>
    <header>
        <h1 class="site-title">PAPERPREP</h1>
        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </header>
    <main>
        <section class="tool-grid">
            <a href="/tool/pdf-to-word" class="tool-card">PDF to Word</a>
            <a href="/tool/images-to-pdf" class="tool-card">Image to PDF</a>
            <a href="/tool/ppt-to-pdf" class="tool-card">PPT to PDF</a>
            <a href="/tool/pdf-to-ppt" class="tool-card">PDF to PPT</a>
            <a href="/tool/merge-pdf" class="tool-card">Merge PDFs</a>
            <a href="/tool/pdf-splitter" class="tool-card">Split PDF</a>
            <a href="/tool/compress-image" class="tool-card">Compress Image</a>
            <a href="/tool/compress-pdf" class="tool-card">Compress PDF</a>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 PAPERPREP. All rights reserved.</p>
    </footer>

    <script>
        function toggleTheme() {
            const currentTheme = localStorage.getItem("theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        }
    </script>
</body>
</html>
