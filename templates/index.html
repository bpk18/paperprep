<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPrep - File Conversion Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<!-- Header Section -->
<header class="bg-primary text-white text-center py-4">
    <h1>PaperPrep</h1>
    <p>Effortless File Conversion for Your Documents</p>
</header>

<!-- Tools Section -->
<div class="container my-5">
    <div class="row">
        <!-- PDF to Word Tool -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">PDF to Word</h5>
                    <p>Convert your PDF files to Word documents easily.</p>
                    <a href="{{ url_for('pdf_to_word') }}" class="btn btn-primary">Convert</a>
                </div>
            </div>
        </div>
        
        <!-- JPG to PDF Tool -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">JPG to PDF</h5>
                    <p>Convert your image files (JPG/PNG) into a PDF.</p>
                    <a href="{{ url_for('jpg_to_pdf') }}" class="btn btn-primary">Convert</a>
                </div>
            </div>
        </div>

        <!-- Excel to PDF Tool -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Excel to PDF</h5>
                    <p>Convert your Excel files into PDFs.</p>
                    <a href="{{ url_for('excel_to_pdf') }}" class="btn btn-primary">Convert</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer Section -->
<footer class="bg-dark text-white text-center py-4">
    <p>&copy; 2025 PaperPrep. All Rights Reserved.</p>
</footer>

<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
