<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPrep - File Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        .converter-box {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        #status {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="converter-box bg-white">
            <h2 class="text-center mb-4">
                <i class="bi bi-file-earmark-text"></i> PaperPrep
            </h2>
            <p class="text-center text-muted mb-4">Convert your documents to different formats</p>
            
            <form id="converterForm">
                <div class="mb-3">
                    <label for="fileInput" class="form-label">Select file:</label>
                    <input class="form-control" type="file" id="fileInput" required>
                </div>
                
                <div class="mb-3">
                    <label for="formatSelect" class="form-label">Convert to:</label>
                    <select class="form-select" id="formatSelect" disabled required>
                        <option value="">Select a file first</option>
                    </select>
                </div>
                
                <div id="status" class="alert"></div>
                
                <button type="submit" class="btn btn-primary w-100" id="convertBtn">
                    <i class="bi bi-arrow-repeat"></i> Convert File
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
