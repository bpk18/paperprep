<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERPREP</title>
    <style>
        /* --- CSS Styles --- */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background-color: #1e1e1e;
            color: #f0f0f0;
        }

        header {
            background-color: #a7c957;
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .back-button {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid white;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #theme-toggle {
            background: none;
            color: white;
            border: 1px solid white;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .container {
            padding: 20px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .tool-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        body.dark-mode .tool-card {
            background-color: #2c2c2c;
            color: #f0f0f0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .tool-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .tool-card img {
            max-width: 60px;
            height: auto;
            margin-bottom: 10px;
        }

        .tool-card span {
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: white;
        }

        body.dark-mode footer {
            background-color: #222;
            color: #eee;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 10px;
            }

            .tool-card {
                padding: 15px;
            }

            .tool-card img {
                max-width: 40px;
                margin-bottom: 5px;
            }

            .tool-card span {
                font-size: 0.9rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            #theme-toggle, .back-button {
                padding: 0.4rem 0.8rem;
                font-size: 0.9rem;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>PAPERPREP</h1>
        <button id="theme-toggle">Light/Dark Mode</button>
    </header>
    <main class="container">
        <div class="tools-grid">
            <a href="/pdf_to_word" class="tool-card">
                <img src="static/img/pdf_to_word.png" alt="PDF to Word">
                <span>PDF to Word</span>
            </a>
            <a href="/jpg_to_word" class="tool-card">
                <img src="static/img/jpg_to_word.png" alt="JPG to Word">
                <span>JPG to Word</span>
            </a>
            <a href="/ppt_to_pdf" class="tool-card">
                <img src="static/img/ppt_to_pdf.png" alt="PPT to PDF">
                <span>PPT to PDF</span>
            </a>
            <a href="/pdf_to_ppt" class="tool-card">
                <img src="static/img/pdf_to_ppt.png" alt="PDF to PPT">
                <span>PDF to PPT</span>
            </a>
            <a href="/merge_pdf" class="tool-card">
                <img src="static/img/merge_pdf.png" alt="Merge PDF">
                <span>Merge PDF</span>
            </a>
            <a href="/images_to_pdf" class="tool-card">
                <img src="static/img/images_to_pdf.png" alt="Multiple Images to PDF">
                <span>Multiple Images to PDF</span>
            </a>
            <a href="/image_compressor" class="tool-card">
                <img src="static/img/image_compressor.png" alt="Image Compressor">
                <span>Image Compressor</span>
            </a>
            <a href="/pdf_compressor" class="tool-card">
                <img src="static/img/pdf_compressor.png" alt="PDF Compressor">
                <span>PDF Compressor</span>
            </a>
            </div>
    </main>
    <footer>
        <p>&copy; 2025 PAPERPREP - Your Document Conversion Hub</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;
            const currentTheme = localStorage.getItem('theme');

            if (currentTheme === 'dark') {
                body.classList.add('dark-mode');
            }

            themeToggle.addEventListener('click', function() {
                body.classList.toggle('dark-mode');
                const newTheme = body.classList.contains('dark-mode') ? 'dark' : 'light';
                localStorage.setItem('theme', newTheme);
            });
        });
    </script>
</body>
</html>
