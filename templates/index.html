<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAPERPREP</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-700 text-white min-h-screen">
  <div class="container mx-auto p-6">
    <h1 class="text-4xl font-bold text-center mb-8">PAPERPREP</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      {% for tool in [
        'pdf-to-word', 'jpg-to-word', 'pdf-splitter', 'pdf-to-ppt',
        'images-to-pdf', 'merge-pdf', 'compress-image', 'compress-pdf'
      ] %}
        <a href="{{ url_for('tool', tool_name=tool) }}" class="p-6 rounded-xl shadow-lg bg-gradient-to-r from-blue-500 to-purple-600 text-white text-center hover:scale-105 transform transition duration-300">
          <h2 class="text-xl font-semibold capitalize">{{ tool.replace('-', ' ') }}</h2>
        </a>
      {% endfor %}
    </div>
  </div>
</body>
</html>
