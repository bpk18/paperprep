<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPrep - File Conversion Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding-top: 50px;
        }
        .tool-btn {
            display: block;
            margin: 10px 0;
            font-size: 1.2em;
            padding: 15px;
            text-align: center;
            color: white;
            background-color: #007bff;
            border: none;
            width: 100%;
        }
        .tool-btn:hover {
            background-color: #0056b3;
        }
        .container {
            max-width: 800px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Welcome to PaperPrep File Conversion Tools</h2>
    <div class="row">
        <div class="col-md-4">
            <a href="/pdf-to-word" class="tool-btn">
                <i class="fas fa-file-pdf"></i> PDF to Word
            </a>
        </div>
        <div class="col-md-4">
            <a href="/jpg-to-pdf" class="tool-btn">
                <i class="fas fa-file-image"></i> JPG to PDF
            </a>
        </div>
        <div class="col-md-4">
            <a href="/pdf-to-png" class="tool-btn">
                <i class="fas fa-file-image"></i> PDF to PNG
            </a>
        </div>
        <div class="col-md-4">
            <a href="/word-to-pdf" class="tool-btn">
                <i class="fas fa-file-word"></i> Word to PDF
            </a>
        </div>
        <div class="col-md-4">
            <a href="/excel-to-pdf" class="tool-btn">
                <i class="fas fa-file-excel"></i> Excel to PDF
            </a>
        </div>
        <div class="col-md-4">
            <a href="/pdf-merge" class="tool-btn">
                <i class="fas fa-compress"></i> PDF Merger
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
