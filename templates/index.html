{% extends "base.html" %}

{% block title %}Home - PaperPrep{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-4">Available Tools</h2>
<form action="{{ url_for('process') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
    <label>Select Tool:</label>
    <select name="tool" class="w-full p-2 rounded border dark:bg-gray-800">
        <option value="PDF to Word">PDF to Word</option>
        <option value="Multiple Images to PDF">Multiple Images to PDF</option>
        <option value="PPT to PDF">PPT to PDF</option>
        <option value="PDF to PPT">PDF to PPT</option>
        <option value="Word to PDF">Word to PDF</option>
        <option value="Image Resizer">Image Resizer</option>
        <option value="PDF Compressor">PDF Compressor</option>
    </select>

    <label>Upload File:</label>
    <input type="file" name="file" class="w-full p-2 border rounded dark:bg-gray-800" required>

    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Simulate Upload</button>
</form>
{% endblock %}
