<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PAPERPREP is a futuristic and responsive toolset for converting PDFs, images, and presentations.">
    <meta name="keywords" content="PDF tools, Image to PDF, File conversion, Merge PDF, Compress PDF, Convert PPT">
    <meta name="author" content="PAPERPREP Team">
    <title>PAPERPREP - File Conversion Made Easy</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
      if (!localStorage.getItem('theme')) {
          localStorage.setItem('theme', 'light');
          document.documentElement.setAttribute('data-theme', 'light');
      } else {
          document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));
      }
    </script>
</head>
<body>
    <header>
        <button class="menu-toggle" onclick="toggleMenu()">&#9776;</button>
        <nav id="mobile-menu" class="hidden">
            <a href="/tool/pdf-to-word">PDF to Word</a>
            <a href="/tool/images-to-pdf">Image to PDF</a>
            <a href="/tool/ppt-to-pdf">PPT to PDF</a>
            <a href="/tool/pdf-to-ppt">PDF to PPT</a>
            <a href="/tool/merge-pdf">Merge PDFs</a>
            <a href="/tool/pdf-splitter">Split PDF</a>
            <a href="/tool/compress-image">Compress Image</a>
            <a href="/tool/compress-pdf">Compress PDF</a>
            <hr>
            <a href="/about">About</a>
            <a href="/privacy">Privacy</a>
            <a href="/contact">Contact</a>
            <a href="/terms">Terms & Conditions</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </header>

    <main>
        <section class="tool-grid">
            <a href="/tool/pdf-to-word" class="tool-card">PDF to Word</a>
            <a href="/tool/images-to-pdf" class="tool-card">Image to PDF</a>
            <a href="/tool/ppt-to-pdf" class="tool-card">PPT to PDF</a>
            <a href="/tool/pdf-to-ppt" class="tool-card">PDF to PPT</a>
            <a href="/tool/merge-pdf" class="tool-card">Merge PDFs</a>
            <a href="/tool/pdf-splitter" class="tool-card">Split PDF</a>

        </section>
    </main>

    <footer>
        <p>&copy; 2025 PAPERPREP. All rights reserved.</p>
    </footer>

    <script>
        function toggleTheme() {
            const currentTheme = localStorage.getItem("theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        }

        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
