<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPrep - File Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        .converter-box {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: white;
        }
        #status {
            display: none;
            transition: all 0.3s ease;
        }
        #progressContainer {
            display: none;
            margin: 1rem 0;
            height: 25px;
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="converter-box">
            <h2 class="text-center mb-4">
                <i class="bi bi-file-earmark-text text-primary"></i> PaperPrep
            </h2>
            <p class="text-center text-muted mb-4">Convert your documents between different formats</p>
            
            <form id="converterForm">
                <div class="mb-3">
                    <label for="fileInput" class="form-label">Select file:</label>
                    <input class="form-control" type="file" id="fileInput" required>
                    <div class="form-text">Supported: PDF, DOCX, JPG, PNG, TXT</div>
                </div>
                
                <div class="mb-3">
                    <label for="formatSelect" class="form-label">Convert to:</label>
                    <select class="form-select" id="formatSelect" disabled required>
                        <option value="">Select a file first</option>
                    </select>
                </div>
                
                <div id="progressContainer" class="progress">
                    <div id="progressBar" class="progress-bar progress-bar-striped" 
                         role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
                
                <div id="status" class="alert" style="display: none;"></div>
                
                <button type="submit" class="btn btn-primary w-100 py-2" id="convertBtn">
                    <i class="bi bi-arrow-repeat"></i> Convert File
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
