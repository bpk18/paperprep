<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPrep - File Converter Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
            padding-top: 60px;
        }
        .tool-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .btn-custom {
            background: #007BFF;
            color: white;
        }
        .btn-custom:hover {
            background: #0056b3;
        }
        .tool-header {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">📄 PaperPrep - Smart Document Tools</h1>

        <!-- Unique Tools -->
        <div class="row">
            <div class="col-md-6">
                <div class="tool-card">
                    <div class="tool-header">Resume Tailoring Tool</div>
                    <form id="resume-tailoring-form" enctype="multipart/form-data">
                        <input type="file" name="resume_file" class="form-control mb-2" required>
                        <textarea name="job_description" class="form-control mb-2" placeholder="Paste job description..." required></textarea>
                        <button class="btn btn-custom" type="submit">Tailor Resume</button>
                        <div id="resume-tailoring-result"></div>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="tool-card">
                    <div class="tool-header">Cover Letter Generator</div>
                    <form id="cover-letter-form" enctype="multipart/form-data">
                        <input type="text" name="job_title" class="form-control mb-2" placeholder="Job Title" required>
                        <textarea name="experience" class="form-control mb-2" placeholder="Your experience..." required></textarea>
                        <button class="btn btn-custom" type="submit">Generate Cover Letter</button>
                        <div id="cover-letter-result"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Standard Tools (Example: PDF to Word, JPG to PDF) -->
        <div class="row">
            <div class="col-md-6">
                <div class="tool-card">
                    <div class="tool-header">PDF to Word</div>
                    <form id="pdf-to-word-form" enctype="multipart/form-data">
                        <input type="file" name="pdf_file" class="form-control mb-2" required>
                        <button class="btn btn-custom" type="submit">Convert</button>
                        <div id="pdf-to-word-result"></div>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="tool-card">
                    <div class="tool-header">JPG to PDF</div>
                    <form id="jpg-to-pdf-form" enctype="multipart/form-data">
                        <input type="file" name="jpg_file" class="form-control mb-2" accept="image/*" required>
                        <button class="btn btn-custom" type="submit">Convert</button>
                        <div id="jpg-to-pdf-result"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Add more tool cards similarly -->

        <footer>
            &copy; 2025 PaperPrep. All rights reserved.
        </footer>
    </div>

    <!-- Bootstrap & AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#resume-tailoring-form').on('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: '/resume-tailor',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: res => $('#resume-tailoring-result').html('<a href="' + res.file + '" class="btn btn-success mt-2">Download Result</a>')
            });
        });

        $('#cover-letter-form').on('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: '/generate-cover-letter',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: res => $('#cover-letter-result').html('<a href="' + res.file + '" class="btn btn-success mt-2">Download Cover Letter</a>')
            });
        });

        $('#pdf-to-word-form').on('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: '/convert-pdf-to-word',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: res => $('#pdf-to-word-result').html('<a href="' + res.file + '" class="btn btn-success mt-2">Download Word</a>')
            });
        });

        $('#jpg-to-pdf-form').on('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: '/convert-jpg-to-pdf',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: res => $('#jpg-to-pdf-result').html('<a href="' + res.file + '" class="btn btn-success mt-2">Download PDF</a>')
            });
        });
    </script>
</body>
</html>
