
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PAPERPREP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body class="{{ theme }}-theme">
  <nav>
    <div class="brand">PAPERPREP</div>
    <div class="nav-items">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/privacy">Privacy</a>
      <a href="/contact">Contact</a>
      <a href="/terms">Terms</a>
      <button id="theme-toggle">Toggle Theme</button>
    </div>
  </nav>
  <main>
    <h1>All-in-One Document Tools</h1>
    <div class="tools-grid">
      <a href="/tool/pdf-to-word" class="tool-card"><i class="fas fa-file-word"></i><div>PDF to Word</div></a>
      <a href="/tool/jpg-to-word" class="tool-card"><i class="fas fa-image"></i><div>JPG to Word</div></a>
      <a href="/tool/ppt-to-pdf" class="tool-card"><i class="fas fa-file-powerpoint"></i><div>PPT to PDF</div></a>
      <a href="/tool/pdf-to-ppt" class="tool-card"><i class="fas fa-file-pdf"></i><div>PDF to PPT</div></a>
      <a href="/tool/images-to-pdf" class="tool-card"><i class="fas fa-file-image"></i><div>Images to PDF</div></a>
      <a href="/tool/merge-pdf" class="tool-card"><i class="fas fa-compress"></i><div>Merge PDF</div></a>
      <a href="/tool/image-compressor" class="tool-card"><i class="fas fa-compress-arrows-alt"></i><div>Image Compressor</div></a>
      <a href="/tool/pdf-compressor" class="tool-card"><i class="fas fa-file-archive"></i><div>PDF Compressor</div></a>
    </div>
  </main>
</body>
</html>
