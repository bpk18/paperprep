<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PaperPrep - File Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-4">
      <img src="/static/logo.png" width="60">
      <h1 class="mt-2">PaperPrep</h1>
      <p class="text-muted">Your All-in-One Document Toolkit</p>
    </div>

    <div class="row g-3">
      <!-- Image to PDF (3rd spot) -->
      <div class="col-md-6">
        <div class="tool-box p-3 border rounded">
          <h5><img src="/static/icons/image-to-pdf.png" width="24"> Image to PDF</h5>
          <form id="imageToPDFForm">
            <input type="file" name="images[]" multiple required class="form-control mb-2">
            <button type="submit" class="btn btn-primary">Convert</button>
            <div id="imageToPDFResult" class="mt-2"></div>
          </form>
        </div>
      </div>

      <!-- Merge PDF -->
      <div class="col-md-6">
        <div class="tool-box p-3 border rounded">
          <h5><img src="/static/icons/merge-pdf.png" width="24"> Merge PDF</h5>
          <form id="mergePDFForm">
            <input type="file" name="pdfs[]" multiple required class="form-control mb-2">
            <button type="submit" class="btn btn-primary">Merge</button>
            <div id="mergePDFResult" class="mt-2"></div>
          </form>
        </div>
      </div>

      <!-- Add more tools here as needed -->
      <!-- Word to PDF, Excel to PDF, PPT to PDF, PDF Compressor, Image Compressor, Photo Resizer -->

      <!-- Unique tools at bottom -->
      <div class="col-md-12">
        <h4 class="mt-4">Advanced Tools</h4>
        <ul>
          <li>Resume Tailoring Tool</li>
          <li>Cover Letter Generator</li>
          <li>LinkedIn to Resume</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("mergePDFForm").onsubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const res = await fetch('/merge_pdf', { method: 'POST', body: data });
      const result = await res.json();
      document.getElementById("mergePDFResult").innerHTML = `<a href="${result.download_url}" class="btn btn-success mt-2">Download Merged PDF</a>`;
    };

    document.getElementById("imageToPDFForm").onsubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const res = await fetch('/image_to_pdf', { method: 'POST', body: data });
      const result = await res.json();
      document.getElementById("imageToPDFResult").innerHTML = `<a href="${result.download_url}" class="btn btn-success mt-2">Download PDF</a>`;
    };
  </script>
</body>
</html>
