<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tailor your resume to match the job description and stand out!">
    <title>Resume Tailoring Tool | PaperPrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .container {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Resume Tailoring Tool</h2>
        <form action="/resume-tailor" method="POST">
            <div class="form-group mb-3">
                <label for="resume_text">Paste Your Resume Text:</label>
                <textarea class="form-control" id="resume_text" name="resume_text" rows="6" required></textarea>
            </div>
            <div class="form-group mb-3">
                <label for="job_description">Paste the Job Description:</label>
                <textarea class="form-control" id="job_description" name="job_description" rows="6" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Tailor My Resume</button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
